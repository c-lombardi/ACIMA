name: ACIMA conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Python behaviour tests
        working-directory: examples/python
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: TypeScript behaviour tests
        working-directory: examples/typescript
        run: node --test tests/*.test.mjs

      - name: Go tests
        working-directory: examples/go
        run: go test ./...

      - name: .NET build, host, and gallery
        working-directory: examples/dotnet
        run: |
          dotnet build host/Host/Host.csproj --nologo -v q
          dotnet run --project tools/Acima.ArchTests -- --root . --verify

      - name: Skill self-architecture and bundle
        run: |
          python3 conformance/test_skill_architecture.py -v
          python3 conformance/test_skill_bundle.py -v

      - name: Full conformance suite
        run: python3 conformance/run.py --artifacts acima-artifacts

      - name: Evidence report
        run: python3 tools/acima.py report --root examples/python --format markdown > acima-report.md

      - uses: actions/upload-artifact@v4
        with:
          name: acima-evidence
          path: |
            acima-report.md
            acima-artifacts/

  crlf-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert checkout to CRLF and prove it
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8").split("\0")
          converted = 0
          for relative in tracked:
              if not relative:
                  continue
              path = Path(relative)
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              crlf = data.replace(b"\r\n", b"\n").replace(b"\n", b"\r\n")
              if crlf != data:
                  path.write_bytes(crlf)
                  converted += 1
          if converted == 0:
              raise SystemExit("no tracked files were converted to CRLF")
          sample = Path("tools/acima.py").read_bytes()
          if b"\r\n" not in sample:
              raise SystemExit("tools/acima.py is not CRLF after conversion")
          print(f"converted {converted} tracked files to CRLF")
          PY

      - name: Bundle check on CRLF checkout
        run: |
          python3 tools/bundle_skill.py --check
          python3 conformance/test_skill_bundle.py -v
